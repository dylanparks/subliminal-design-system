# Deploys the Astro site's static build output as a Cloudflare Worker (Workers Static Assets).
# Build command (set in the Cloudflare dashboard) must produce ./site/dist before this runs:
#   npm run build:site   (builds the design system, then the site, then checks the site's CSP)
name = "subliminal-design-system"
compatibility_date = "2026-07-19"

[assets]
directory = "./site/dist"
# Unknown URLs return the built 404.html (with a 404 status) instead of an empty response.
not_found_handling = "404-page"
