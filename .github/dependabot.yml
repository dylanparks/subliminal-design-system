# Weekly dependency updates, so security fixes arrive as small pull requests instead of a pile-up.
# Minor and patch updates are grouped; major updates come one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/design-system"
      - "/site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
